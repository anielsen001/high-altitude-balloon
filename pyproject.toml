[project]
name = "high-altitude-balloon"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "astropy>=7.1.0",
    "bash-kernel>=0.10.0",
    "feather-format>=0.4.1",
    "gpxpy>=1.6.2",
    "inu>=2.5.6",
    "ipython>=9.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.7",
    "numpy>=2.3.1",
    "pyarrow>=22.0.0",
    "scipy>=1.16.0",
    "setuptools>=80.9.0",
    "simplekml>=1.3.6",
    "sos>=0.25.1",
    "sos-bash>=0.21.0",
    "sos-julia>=0.20.0",
    "sos-notebook>=0.24.4",
    "sos-papermill>=0.2.1",
    "sos-python>=0.20.2",
]

[tool.uv.workspace]
members = [
    "_sources/wspr/bare",
    "_sources/wspr",
]
